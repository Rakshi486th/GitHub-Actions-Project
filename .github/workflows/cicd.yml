name: CICD pipeline

on:
  push:
    branches: [ "main" ]
    
jobs:
  compile:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  Security-check:
    runs-on: self-hosted
    needs: compile

    steps:
    - uses: actions/checkout@v4
    
    
    - name: Verify Trivy
      run: trivy --version

    - name: Resolve Maven dependencies
      run: mvn dependency:resolve
      
    

    - name: Trivy FS Scan
      run: trivy fs --skip-version-check --format table -o fs-report.json .

    - name: Gitleaks Installation
      run: sudo apt install gitleaks -y

    - name: Gitleaks code scan 
      run: gitleaks detect source .  

  test:
    runs-on: self-hosted
    needs: Security-check
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Unit Test cases
      run: mvn test 

      
  build_sonar_scan:
    runs-on: self-hosted
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build project
      run: mvn package

    - name: Upload jar artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
      
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify SONAR_TOKEN
      run: |
         if [ -z "$SONAR_TOKEN" ]; then
           echo "SONAR_TOKEN is EMPTY"
         exit 1
         else
           echo "SONAR_TOKEN exists"
         fi
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.0.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@master
      with:
          pollingTimeoutSec: 600
      env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  

  build_docker_image_and_push:
    runs-on: self-hosted
    needs: build_sonar_scan
    steps:
    - uses: actions/checkout@v4
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: app

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
          context: .
          push: true
          tags: rakshi1/bank_app:latest  
    - name: Print Dockerfile
      run: cat Dockerfile      
  
  
          
    





        
